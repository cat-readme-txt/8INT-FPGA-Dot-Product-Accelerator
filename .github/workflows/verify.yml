name: RTL and FPGA verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys nextpnr-ice40 fpga-icestorm
      - run: python -m pip install -r requirements.txt
      - run: make test
      - run: make synth
      - run: make icebreaker
      - run: make gate-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            build/reports/
            build/icebreaker/
